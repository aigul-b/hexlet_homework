{% extends "base.html" %}

{% block content %}
<h2 class="mb-4">Сайт #{{ url.id }}</h2>

<!-- Атрибут data-test="url" обязателен по заданию -->
<table class="table table-bordered table-hover w-50" data-test="url">
    <tbody>
        <tr>
            <th class="col-sm-4">ID</th>
            <td>{{ url.id }}</td>
        </tr>
        <tr>
            <th>Имя</th>
            <td>{{ url.name }}</td>
        </tr>
        <tr>
            <th>Дата создания</th>
            <td>{{ url.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
        </tr>
    </tbody>
</table>

<a href="{{ url_for('urls_list') }}" class="btn btn-secondary mt-3">Назад</a>
{% endblock %}
